<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Note - Email confirmed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #080d1a; --bg2: #0c1221; --border: #1b2742; --accent: #4f7cff; --ok: #34d399; --bad: #f87171; --text: #dde3f0; --dim: #7a8aaa; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 44px 32px; max-width: 440px; width: 100%; text-align: center; }
    .badge { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; font-size: 34px; background: rgba(52,211,153,.12); color: var(--ok); }
    .badge.bad { background: rgba(248,113,113,.12); color: var(--bad); }
    h1 { font-size: 26px; margin-bottom: 10px; }
    p { color: var(--dim); line-height: 1.6; font-size: 15px; margin-bottom: 8px; }
    .btn { display: inline-block; margin-top: 22px; background: var(--accent); color: #fff; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: 600; font-size: 16px; }
    .small { font-size: 13px; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" id="badge">&#10003;</div>
    <h1 id="title">Email confirmed</h1>
    <p id="msg">Your Gym Note account is ready. Open the app and log in with your email and password.</p>
    <a class="btn" id="open" href="mobileworkout://">Open Gym Note</a>
    <p class="small">If the button does nothing, just switch back to the Gym Note app and log in.</p>
  </div>
  <script>
    var hash = window.location.hash.replace(/^#/, '');
    var params = new URLSearchParams(hash || window.location.search.replace(/^\?/, ''));
    var err = params.get('error_description') || params.get('error');
    if (err) {
      document.getElementById('badge').className = 'badge bad';
      document.getElementById('badge').innerHTML = '!';
      document.getElementById('title').textContent = 'This link did not work';
      document.getElementById('msg').textContent = 'The confirmation link may have expired or already been used. If you can already log in, you are all set. Otherwise sign up again in the app to get a new email.';
    }
  </script>
</body>
</html>
